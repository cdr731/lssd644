<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <hr>
        <h1>
            {{ page_name }}
        </h1>
        <br>
        <br>
    </header>

    <h2>
        Current Messages
    </h2>
    
    {% for message in messages %}
        <div>
            <h3>
                {{ message['user'] }}
            </h3>
            <p>
                {{ message['content'] }}
            </p>
        </div>
        <br>
        <hr>
    {% endfor %}
    <hr>

</body>
